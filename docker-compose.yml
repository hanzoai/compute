version: '3.1'
services:
  visor:
    restart: always
    build:
      context: ./
      dockerfile: Dockerfile
      target: STANDARD
    entrypoint: /bin/sh -c './visor --createDatabase=true'
    ports:
      - "19000:19000"
    depends_on:
      - db
    environment:
      RUNNING_IN_DOCKER: "true"
      DB_DSN: "${DB_DSN:-user=hanzo dbname=hanzo_visor host=db port=5432 sslmode=disable}"
      IAM_CLIENT_ID: "${IAM_CLIENT_ID:-}"
      IAM_CLIENT_SECRET: "${IAM_CLIENT_SECRET:-}"
      COMMERCE_URL: "${COMMERCE_URL:-}"
      COMMERCE_TOKEN: "${COMMERCE_TOKEN:-}"
      AUTOSCALER_CLUSTERS: "${AUTOSCALER_CLUSTERS:-}"
    volumes:
      - ./conf:/conf/
  db:
    restart: always
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-hanzo}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: hanzo_visor
    volumes:
      - pgdata:/var/lib/postgresql/data
  guacd:
    image: guacamole/guacd:latest
    environment:
      GUACD_LOG_LEVEL: debug
    volumes:
      - ./data/guacd:/usr/local/visor/data
    ports:
      - "4822:4822"
    restart:
      always

volumes:
  pgdata:
