name: Docker
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/visor
      target: STANDARD
      platforms: linux/amd64,linux/arm64
      # runner labels are JSON-array STRINGS (shared workflow decodes via fromJson).
      # amd64 → the working K8s ARC label (cloud uses this); arm64 → spark's arcd.
      runner-amd64: '["hanzo-build-linux-amd64"]'
      runner-arm64: '["self-hosted","linux","arm64"]'
    secrets: inherit
