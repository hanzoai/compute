name: Docker
on:
  workflow_dispatch:
  push:
    branches: [main, master, dev, test]
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  visor:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/visor
      target: STANDARD
    secrets: inherit
  visor-allinone:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/visor-allinone
      target: ALLINONE
    secrets: inherit
