name: Docker
# Fast Go native cross-compile on ONE amd64 DOKS runner. The Dockerfile's build
# stage is `FROM --platform=$BUILDPLATFORM golang` + `GOARCH=${TARGETARCH}`, so
# the Go binary for BOTH arches is cross-compiled natively (seconds, no
# emulation). QEMU is set up only so the tiny final alpine layer (apk add) can
# run for the linux/arm64 variant. A single buildx call emits the multi-arch
# manifest — no scarce arm64 runner, no per-arch job fan-out.
#
# Bespoke (not the shared hanzoai/.github docker-build.yml) because that workflow
# builds native-per-arch on separate runners; this proves the single-runner
# cross-compile path. Fold back into the shared workflow's opt-in `cross-compile`
# mode once validated.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  build:
    runs-on: ['hanzo-build-linux-amd64']
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 final-layer emulation only)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host

      - name: Log in to ghcr.io (GH_PAT — reads private base images + pushes)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: hanzo-dev
          password: ${{ secrets.GH_PAT }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hanzoai/visor
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build + push (amd64 native + arm64 cross-compiled)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: STANDARD
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=visor
          cache-to: type=gha,scope=visor,mode=max
          secrets: |
            gh_token=${{ secrets.GH_PAT }}
