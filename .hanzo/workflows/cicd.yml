# Canonical caller — every knob lives in /hanzo.yml, none here.
#
# `.hanzo/workflows`, not `.github/workflows`: git.hanzo.ai reads the FIRST of
# those directories present in the commit, and the git-runner pool that
# advertises `hanzo-build-linux-amd64` registers against git.hanzo.ai only.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.hanzo/workflows/build.yml@v1
    with:
      # Not on a tag: a tag is cut from a commit this gate already passed on
      # main, so a tag build re-proves a proven tree. STRING, compared against
      # 'false' — git.hanzo.ai resolves every boolean workflow_call input to
      # false, including one explicitly passed true.
      tests: ${{ github.ref_type != 'tag' }}
    secrets: inherit
