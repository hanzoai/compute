apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute
  namespace: hanzo
  labels:
    app: compute
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: compute
  template:
    metadata:
      labels:
        app: compute
    spec:
      serviceAccountName: compute
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: compute
          image: ghcr.io/hanzoai/compute:latest
          ports:
            - containerPort: 19000
              protocol: TCP
          env:
            - name: RUNNING_IN_DOCKER
              value: "true"
          envFrom:
            - secretRef:
                name: compute-env
                optional: true
          volumeMounts:
            - name: config
              mountPath: /conf/app.conf
              subPath: app.conf
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 19000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 19000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          secret:
            secretName: compute-config
