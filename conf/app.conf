appname = hanzo-visor
httpport = 19000
runmode = dev
SessionOn = true
copyrequestbody = true
driverName = postgres
dataSourceName = ${DB_DSN||user=hanzo dbname=hanzo_visor host=localhost port=5432 sslmode=disable}
dbName = hanzo_visor
storageBackend = ${STORAGE_BACKEND||base}
dataRoot = ${DATA_ROOT||/data}
tableNamePrefix =
isDemoMode = false
logPostOnly = true
guacamoleEndpoint = 127.0.0.1:4822
iamEndpoint = https://iam.hanzo.ai
clientId = ${IAM_CLIENT_ID||}
clientSecret = ${IAM_CLIENT_SECRET||}
iamOrganization = "hanzo"
iamApplication = "app-hanzo-visor"

# The org whose active cloud Provider rows are this deployment's platform
# Kubernetes accounts. Unset means there are none.
platformOwner = ${PLATFORM_OWNER||}

# Hosted compute: Hanzo's own AWS EC2 account, where every org's hosted machines
# run. No AWS key is configured here or anywhere. EC2 is called as the role
# computeRoleArn, assumed with sts:AssumeRoleWithWebIdentity, and the web
# identity is a client_credentials token of the Hanzo IAM app named by
# computeIamClientId, minted at computeIamEndpoint (hanzo.id when unset).
# Every call refuses, naming what is missing, without the region, the role and
# the client credential; a launch also needs the subnet and security group, and
# computeGpuImage for a GPU size or computeImage for any other. Both images are
# x86_64.
computeRegion = ${COMPUTE_REGION||}
computeSubnet = ${COMPUTE_SUBNET||}
computeSecurityGroup = ${COMPUTE_SECURITY_GROUP||}
computeImage = ${COMPUTE_IMAGE||}
computeGpuImage = ${COMPUTE_GPU_IMAGE||}
computeRoleArn = ${COMPUTE_ROLE_ARN||}
computeIamClientId = ${COMPUTE_IAM_CLIENT_ID||}
computeIamClientSecret = ${COMPUTE_IAM_CLIENT_SECRET||}
computeIamEndpoint = ${COMPUTE_IAM_ENDPOINT||}
