appname = hanzo-visor
httpport = 19000
runmode = dev
SessionOn = true
copyrequestbody = true
driverName = postgres
dataSourceName = ${DB_DSN||user=hanzo dbname=hanzo_visor host=localhost port=5432 sslmode=disable}
dbName = hanzo_visor
storageBackend = ${STORAGE_BACKEND||base}
dataRoot = ${DATA_ROOT||/data}
tableNamePrefix =
isDemoMode = false
logPostOnly = true
guacamoleEndpoint = 127.0.0.1:4822
iamEndpoint = https://iam.hanzo.ai
clientId = ${IAM_CLIENT_ID||}
clientSecret = ${IAM_CLIENT_SECRET||}
iamOrganization = "hanzo"
iamApplication = "app-hanzo-visor"

# The org whose active cloud Provider rows are this deployment's platform
# Kubernetes accounts. Unset means there are none.
platformOwner = ${PLATFORM_OWNER||}

# Hosted compute: Hanzo's own AWS EC2 account, where every org's hosted machines
# run. No key is configured here or anywhere: EC2 is called as the role the
# process runs as (IRSA web identity, else the node's instance role). A launch
# refuses, naming what is missing: every launch needs the region, subnet and
# security group; a GPU size also needs computeGpuImage, every other size
# computeImage. Both images are x86_64.
computeRegion = ${COMPUTE_REGION||}
computeSubnet = ${COMPUTE_SUBNET||}
computeSecurityGroup = ${COMPUTE_SECURITY_GROUP||}
computeImage = ${COMPUTE_IMAGE||}
computeGpuImage = ${COMPUTE_GPU_IMAGE||}
