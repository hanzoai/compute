appname = hanzo-compute
httpport = 19000
runmode = dev
SessionOn = true
copyrequestbody = true
driverName = postgres
dataSourceName = ${DB_DSN||user=hanzo dbname=hanzo_visor host=localhost port=5432 sslmode=disable}
dbName = hanzo_visor
storageBackend = ${STORAGE_BACKEND||base}
dataRoot = ${DATA_ROOT||/data}
tableNamePrefix =
isDemoMode = false
logPostOnly = true
guacamoleEndpoint = 127.0.0.1:4822
iamEndpoint = https://iam.hanzo.ai
clientId = ${IAM_CLIENT_ID||}
clientSecret = ${IAM_CLIENT_SECRET||}
iamOrganization = "hanzo"
iamApplication = "app-hanzo-visor"

# The org whose active cloud Provider rows are this deployment's own accounts.
# Unset falls back to the single digitalOceanToken (KMS-synced), which is one
# account on one cloud. Set it to hold several keys, on several clouds, at once.
platformOwner = ${PLATFORM_OWNER||}
